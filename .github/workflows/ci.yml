name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Check public API surface
        run: bun run api:check

      - name: Check bundle size
        run: bun run size

      - name: Validate package
        run: bun run lint:pkg

      - name: Check dependency hygiene
        run: bun run check:deps

  rust-validation:
    name: Cross-validate vectors against the Rust reference
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The stored outcomes must first equal the working tree's.
      - name: Check the golden vectors against the working tree
        run: bun run test:golden

      # The whole corpus (tests/corpus/corpus.ts `allRecipes()`); the golden
      # file is a subset of it.
      - name: Materialise the full corpus
        run: bun run vectors:full "${{ runner.temp }}/shamir-full-corpus.json"

      # The runner image ships a stable Rust toolchain; the reference crates
      # are fetched once at the locked versions and built offline.
      - name: Fetch the pinned reference crates
        working-directory: tests/rust-validation
        run: cargo fetch --locked

      - name: Validate the golden vectors against bc-shamir
        working-directory: tests/rust-validation
        run: cargo run --release --locked --offline -- ../vectors/vectors.json

      - name: Validate the full corpus against bc-shamir
        working-directory: tests/rust-validation
        run: cargo run --release --locked --offline -- "${{ runner.temp }}/shamir-full-corpus.json"

      # The comparison must bite: the committed one-vector fixture with a
      # flipped share nibble fails with exactly one MISMATCH.
      - name: Reject the mismatch fixture
        working-directory: tests/rust-validation
        run: |
          set +e
          output=$(cargo run --release --locked --offline --quiet -- mismatch.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -q ' 1 MISMATCH$'
